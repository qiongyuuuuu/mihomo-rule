    - "stun.l.google.com"
    - "+.nflxvideo.net"
    - "+.square-enix.com"
    - "+.finalfantasyxiv.com"
    - "+.ffxiv.com"
    - "+.ff14.sdo.com"
    - "+.teamspeak.com"
    - "+.mcdn.bilivideo.cn"
    - "+.media.dssott.com"
    - "+.cmbchina.com"
    - "+.cmbimg.com"
    - "*.tracker.*"
    - "*.bittorrent.*"
    - "*.torrent.*"
    - "*.dht.*"
    - "*announce*"
    - "*announce.php*"
    - "*udp-tracker.*"
    - "*udp-tracker.*"
    - "tracker.*"
    - "42235"
    - "42236"
    - "9993"
  # DNS 遵循 Clash 规则
  respect-rules: true

  # 启动阶段解析DNS服务器使用 (使用纯IP，极速启动)
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 【关键修改2】代理节点解析无需加密，使用普通UDP最快，消除TLS握手延迟
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 直连规则专属 DNS
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 【关键修改3】复用你底部的 rule-providers 进行精准分流，大幅降低 CPU 匹配耗时
  nameserver-policy:
    "rule-set:cn_domain,private_domain":
      - 223.5.5.5
      - 119.29.29.29
    "rule-set:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query

  # 兜底 DNS (海外防泄露核心)
  # 使用 tcp 协议而不是 https，因为 tcp 报文会直接包裹在代理节点的加密隧道中，
  # 既能100%防国内运营商审查，又能避免 DoH 的二次 TLS 握手，速度提升数倍。
  nameserver:
    - tcp://1.1.1.1
    - tcp://8.8.8.8
 
