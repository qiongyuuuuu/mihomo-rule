# 为smart内核专门修改语法，防止报错配置,以及smart的配置范例：proxy-groups:
#  - name: "🧠 智能选择"       # 策略组名称随意
#    type: smart               # 启用smart内核
#    uselightgbm: true         # 启用 LightGBM 模型预测权重  以下示例配置不开lightbgm，可以自行添加
#    collectdata: false        # 是否收集数据用于本地模型训练（日常使用建议设为 false）
#    strategy: sticky-sessions # 节点选择策略：sticky-sessions（粘性会话，不会频繁切换确认的节点）或 round-robin（不建议 视需求选择）
#    sample-rate: 1            # 采样率 (0~1)  电脑建议1 软路由建议0.2~0.4
#    policy-priority: "HK:1.4;SG:1.3;US:1.0" # 可选：手动为某些地区/节点名称增加基础权重 multiplier，说白了就是每个地区更倾向于的节点倍率，用于机场倍率节点选取使用
#    proxies:
      - 节点A
      - 节点B
    # 或通过 filter / include-all 自动引入节点 下文通过filter引入
proxy-providers:
  Airport1:
    url: "订阅url"
    type: http
    interval: 0
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
  Airport2:
    url: "订阅url"
    type: http
    interval: 0
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
      
# 节点信息
proxies:
  - {name: yourname, dialer-proxy: 链式代理, server: 114.5.1.4, port: 8443, type: ss, cipher: aes-256-gcm, password: 1145141919810}
  - {name: yourname, dialer-proxy: 链式特殊, server: 11.45.1.4, port: 8443, type: ss, cipher: aes-256-gcm, password: 1145141919810}
  - {name: 直连, type: direct}
# 全局配置
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""
external-ui: /etc/openclash/ui
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true

# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  prefer-h3: false # 必须关闭！防止节点UDP不通导致强制卡顿10秒等待超时
  ipv6: false

  # fake-ip 模式
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  # fake-ip 排除列表 (已剔除端口号和非法域名通配符)
  fake-ip-filter:
    - "+.lan"
    - "+.localdomain"
    - "+.example"
    - "+.invalid"
    - "+.localhost"
    - "+.test"
    - "+.local"
    - "+.home.arpa"
    - "+.parsec.app"
    - "+.parsecgaming.com"
    - "+.parsec.io"
    - "+.zerotier.com"
    - "+.ztnetwork.io"
    - "time.*"
    - "time1.*"
    - "time2.*"
    - "time3.*"
    - "time4.*"
    - "time5.*"
    - "time6.*"
    - "time7.*"
    - "+.pool.ntp.org"
    - "+.ntp.org.cn"
    - "music.163.com"
    - "+.music.163.com"
    - "+.126.net"
    - "musicapi.taihe.com"
    - "music.taihe.com"
    - "songsearch.kugou.com"
    - "trackercdn.kugou.com"
    - "+.kuwo.cn"
    - "api-jooxtt.sanook.com"
    - "api.joox.com"
    - "+.joox.com"
    - "y.qq.com"
    - "+.y.qq.com"
    - "streamoc.music.tc.qq.com"
    - "mobileoc.music.tc.qq.com"
    - "isure.stream.qqmusic.qq.com"
    - "dl.stream.qqmusic.qq.com"
    - "aqqmusic.tc.qq.com"
    - "amobile.music.tc.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.srv.nintendo.net"
    - "+.n.n.srv.nintendo.net"
    - "stun.playstation.net"
    - "+.xboxlive.com"
    - "xbox.*.microsoft.com"
    - "xnotify.xboxlive.com"
    - "+.battlenet.com.cn"
    - "+.wotgame.cn"
    - "+.wggames.cn"
    - "+.wowsgame.cn"
    - "+.wargaming.net"
    - "proxy.golang.org"
    - "stun.*"
    - "+.stun.*"
    - "heartbeat.belkin.com"
    - "+.linksys.com"
    - "+.linksyssmartwifi.com"
    - "+.router.asus.com"
    - "mesu.apple.com"
    - "swscan.apple.com"
    - "swquery.apple.com"
    - "swdownload.apple.com"
    - "swcdn.apple.com"
    - "swdist.apple.com"
    - "lens.l.google.com"
    - "stun.l.google.com"
    - "+.nflxvideo.net"
    - "+.square-enix.com"
    - "+.finalfantasyxiv.com"
    - "+.ffxiv.com"
    - "+.ff14.sdo.com"
    - "+.teamspeak.com"
    - "+.mcdn.bilivideo.cn"
    - "+.media.dssott.com"
    - "+.cmbchina.com"
    - "+.cmbimg.com"

  # DNS 遵循 Clash 规则
  respect-rules: true

  # 启动阶段解析DNS服务器使用 (使用纯IP, 极速启动)
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 代理节点解析无需加密, 使用普通UDP最快, 消除TLS握手延迟
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 直连规则专属 DNS
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 复用底部的 rule-providers 进行精准分流 (已修正多规则集语法)
  nameserver-policy:
    "rule-set:cn_domain":
      - 223.5.5.5
      - 119.29.29.29
    "rule-set:private_domain":
      - 223.5.5.5
      - 119.29.29.29
    "rule-set:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query

  # 兜底 DNS (海外防泄露核心)
  nameserver:
    - tcp://1.1.1.1
    - tcp://8.8.8.8

