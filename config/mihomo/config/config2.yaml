# 机场订阅
proxy-providers:
  Airport1:
    url: "订阅url"
    type: http
    interval: 0
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
  Airport2:
    url: "订阅url"
    type: http
    interval: 0
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
      
# 节点信息
proxies:
  - {name: yourname, dialer-proxy: 链式代理, server: 114.5.1.4, port: 8443, type: ss, cipher: aes-256-gcm, password: 1145141919810}
  - {name: yourname, dialer-proxy: 链式特殊, server: 11.45.1.4, port: 8443, type: ss, cipher: aes-256-gcm, password: 1145141919810}
  - {name: 直连, type: direct}

# 全局配置 
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true

# DNS模块
# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  prefer-h3: false # 【关键修改1】必须关闭！防止节点UDP不通导致强制卡顿10秒等待超时
  ipv6: false

  # fake-ip 模式
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  # fake-ip 排除列表
  fake-ip-filter:
    - "+.lan"
    - "+.localdomain"
    - "+.example"
    - "+.invalid"
    - "+.localhost"
    - "+.test"
    - "+.local"
    - "+.home.arpa"
    - "+.parsec.app"
    - "+.parsecgaming.com"
    - "+.parsec.io"
    - "+.zerotier.com"
    - "+.ztnetwork.io"
    - "time.*"
    - "time1.*"
    - "time2.*"
    - "time3.*"
    - "time4.*"
    - "time5.*"
    - "time6.*"
    - "time7.*"
    - "+.pool.ntp.org"
    - "+.ntp.org.cn"
    - "music.163.com"
    - "+.music.163.com"
    - "+.126.net"
    - "musicapi.taihe.com"
    - "music.taihe.com"
    - "songsearch.kugou.com"
    - "trackercdn.kugou.com"
    - "+.kuwo.cn"
    - "api-jooxtt.sanook.com"
    - "api.joox.com"
    - "+.joox.com"
    - "y.qq.com"
    - "+.y.qq.com"
    - "streamoc.music.tc.qq.com"
    - "mobileoc.music.tc.qq.com"
    - "isure.stream.qqmusic.qq.com"
    - "dl.stream.qqmusic.qq.com"
    - "aqqmusic.tc.qq.com"
    - "amobile.music.tc.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.srv.nintendo.net"
    - "+.n.n.srv.nintendo.net"
    - "stun.playstation.net"
